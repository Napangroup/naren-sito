<!doctype html>
<html lang="it" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.titolo %}{{ page.titolo | escape }} | Naren Immobiliare{% else %}{{ page.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ page.tipologia | escape }}{% if page.comune and page.comune != '' %} a {{ page.comune | escape }}{% endif %}{% if page.mq %}, {{ page.mq }} m²{% endif %}. {{ page.content | strip_html | truncate: 120 | escape }}{% endif %}">
{%- if page.noindex %}
  <meta name="robots" content="noindex">
{%- else %}
  <link rel="canonical" href="{{ site.url }}{{ page.url | remove: 'index.html' }}">
{%- endif %}
  <meta name="theme-color" content="#14213D">
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="it_IT">
  <meta property="og:site_name" content="Naren Immobiliare">
  <meta property="og:title" content="{% if page.titolo %}{{ page.titolo | escape }}{% else %}{{ page.title | escape }}{% endif %}">
  <meta property="og:url" content="{{ site.url }}{{ page.url | remove: 'index.html' }}">
{%- if page.foto and page.foto.size > 0 %}
  <meta property="og:image" content="{{ site.url }}{{ page.foto | first }}">
{%- else %}
  <meta property="og:image" content="{{ site.url }}/assets/img/og-naren.png">
{%- endif %}
  <link rel="preload" href="/assets/fonts/lora-var.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
{% include header.html %}
{{ content }}
{% include footer.html %}
<script src="/assets/js/illustrazioni.js" defer></script>
<script src="/assets/js/main.js" defer></script>
</body>
</html>
